[project]
name = "isaac-skill-lab"
version = "0.1.0"
description = "Pick-and-place skill training and evaluation in NVIDIA Isaac Sim / Isaac Lab (Franka, own scene, IK controller, scripted demos, BC, evaluation harness)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pavan Yadav Annappa" }]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "checkpoints", "space_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_space.py" = ["E501"]
